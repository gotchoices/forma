<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grid Lab — totu viz</title>
<link rel="stylesheet" href="totu-viz.css">
<style>
.cg input[type=number] {
  width: 46px; padding: 1px 4px; background: var(--btn-bg);
  border: 1px solid var(--btn-border); color: var(--text); border-radius: 3px;
  font-size: 11px;
}
.cg select {
  background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--text);
  font-size: 11px; padding: 1px 4px; border-radius: 3px;
}
#popup {
  position: absolute; background: var(--surface); border: 1px solid var(--accent);
  border-radius: 6px; padding: 8px 10px; z-index: 50; min-width: 130px;
  font-size: 11px; color: var(--text); display: none;
  backdrop-filter: blur(6px); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
#popup .lbl { display: block; color: var(--muted); margin-bottom: 4px; font-size: 10px; }
#popup input {
  width: 100%; padding: 3px 5px; background: var(--btn-bg);
  border: 1px solid var(--btn-border); color: var(--text); border-radius: 3px;
  font-size: 11px; font-family: monospace;
}
#popup .row { display: flex; gap: 4px; margin-top: 5px; justify-content: flex-end; }
#clock-display {
  display: inline-block; min-width: 32px; text-align: center;
  font-weight: 700; font-size: 22px; color: var(--accent);
  font-family: monospace; padding: 1px 10px; line-height: 1.15;
  border: 1px solid var(--accent); border-radius: 5px;
  background: rgba(79,195,247,0.08);
}
#hint {
  position: absolute; top: 8px; left: 14px;
  font: 10.5px/1.4 monospace; color: #555; pointer-events: none;
  background: rgba(10,10,18,0.5); padding: 2px 6px; border-radius: 3px;
}
.info-line { color: #666; }
#labels {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden;
}
.label {
  position: absolute; font: 10px/1.2 monospace; color: #f5f5f5;
  background: rgba(10,10,18,0.62); padding: 1px 5px; border-radius: 3px;
  transform: translate(-50%, -50%); white-space: nowrap;
  pointer-events: none; user-select: none;
  border: 1px solid rgba(255,255,255,0.06);
}
.label.l-stub { color: #c0c0c0; opacity: 0.85; font-style: italic; }
.dim-1d, .dim-2d, .dim-3d, .dim-23 { display: inline-flex; }   /* default; toggled by JS */
</style>
</head>
<body>

<div class="top-bar">
  <h1>Grid Lab</h1><div class="sep"></div>

  <div class="cg">
    <label>Dim</label>
    <select id="sel-dim">
      <option value="1">1D</option>
      <option value="2">2D hex</option>
      <option value="3">3D diamond</option>
    </select>
  </div>

  <!-- 1D-only controls -->
  <div class="cg dim-1d">
    <label>N</label>
    <input type="number" id="in-N" min="2" max="64" step="1" value="6">
  </div>
  <div class="cg tog dim-1d"><label><input type="checkbox" id="cb-periodic"> Periodic</label></div>

  <!-- Shared 2D / 3D controls -->
  <div class="cg dim-23">
    <label>Nx</label>
    <input type="number" id="in-Nx" min="2" max="32" step="1" value="4">
  </div>
  <div class="cg dim-23">
    <label>Ny</label>
    <input type="number" id="in-Ny" min="2" max="256" step="2" value="8">
  </div>
  <div class="cg tog dim-23"><label><input type="checkbox" id="cb-px"> Periodic X</label></div>
  <div class="cg tog dim-23"><label><input type="checkbox" id="cb-py"> Periodic Y</label></div>

  <!-- 3D-only controls -->
  <div class="cg dim-3d">
    <label>Nz</label>
    <input type="number" id="in-Nz" min="2" max="10" step="1" value="3">
  </div>
  <div class="cg tog dim-3d"><label><input type="checkbox" id="cb-pz"> Periodic Z</label></div>

  <!-- Shared wrap toggle: 1D ring (when periodic), 2D torus (when both axes periodic).
       Has no effect in 3D (3-torus wrap deferred). -->
  <div class="cg tog"><label><input type="checkbox" id="cb-wrap"> Wrap</label></div>

  <div class="sep"></div>

  <div class="cg">
    <label>Preset</label>
    <select id="sel-preset"><option value="">—</option></select>
  </div>

  <div class="sep"></div>

  <div class="cg">
    <label>Diam</label>
    <input type="range" id="sl-diam" min="0.1" max="2" step="0.05" value="0.6">
    <span class="val" id="v-diam">0.60</span>
  </div>
  <div class="cg">
    <label>Edge</label>
    <input type="range" id="sl-edge" min="0.1" max="3" step="0.05" value="1.0">
    <span class="val" id="v-edge">1.00</span>
  </div>

  <div class="sep"></div>

  <button class="btn" id="btn-step" title="Advance one half-step">Step ½</button>
  <span id="clock-display" title="Master clock (0 or 1)">0</span>
  <button class="btn" id="btn-run">▶ Run</button>
  <div class="cg">
    <label>Speed</label>
    <input type="range" id="sl-speed" min="0.5" max="20" step="0.5" value="2">
    <span class="val" id="v-speed">2.0</span>
  </div>

  <div class="sep"></div>

  <div class="cg">
    <label>Heat ±</label>
    <input type="range" id="sl-heat" min="0.5" max="50" step="0.5" value="5">
    <span class="val" id="v-heat">5.0</span>
  </div>
  <div class="cg tog"><label><input type="checkbox" id="cb-auto"> Auto</label></div>

  <div class="sep"></div>

  <button class="btn" id="btn-clear" title="Reset all values to zero">Clear</button>
  <button class="btn" id="btn-fit" title="Fit camera to graph">Fit</button>
  <div class="cg tog"><label><input type="checkbox" id="cb-labels" checked> Labels</label></div>

  <div class="sep"></div>

  <div class="cg">
    <label>Profile</label>
    <select id="sel-prof"><option value="">—</option></select>
  </div>
  <button class="btn" id="btn-save" title="Save current state under a name">Save…</button>
  <button class="btn" id="btn-del" title="Delete selected profile">Delete</button>
</div>

<div class="view-full" id="view">
  <div id="hint">click an edge half to set that register's value</div>
  <div id="labels"></div>
  <div id="popup">
    <span class="lbl" id="pop-label">Value</span>
    <input type="text" id="pop-input" autocomplete="off">
    <div class="row">
      <button class="btn" id="pop-cancel">Cancel</button>
      <button class="btn on" id="pop-ok">OK</button>
    </div>
  </div>
  <div class="info-line" id="info"></div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
}}
</script>
<script type="module">
import { THREE, createScene, autoResize, animLoop, PALETTE } from './totu-viz.js';
import {
  build1D, build2D, build3D,
  clear as engineClear,
  halfStep as engineHalfStep,
  applyPreset as engineApplyPreset,
  listPresets as engineListPresets,
  getEdgeRegisters,
  setEdgeRegister,
  totalEnergy,
  isWrapEdge,
} from './grid-engine.js';

// Preset dropdown labels keyed by preset name.
const PRESET_LABEL = {
  'delta-L':   'Delta L',
  'delta-R':   'Delta R',
  'delta-2':   'Delta 2',
  'sin':       'Sin',
  '2d-center': 'Center pulse',
  'knot-1-2':  'Knot (1,2) — WvM',
  'knot-1-1':  'Knot (1,1)',
  'knot-2-1':  'Knot (2,1)',
  'knot-1-0':  'Knot (1,0) — pure ring',
  'knot-0-1':  'Knot (0,1) — pure tube',
};

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;

const STATE_KEY = 'grid-lab-state';
const PROF_KEY  = 'grid-lab-profiles';

/* ── State ─────────────────────────────────────────────── */

const DEFAULT = {
  dim: 1,
  // 1D
  N: 6,
  periodic: false,      // logical wrap-around (engine-level)
  wrap: false,          // visual ring layout (1D only, for now)
  // 2D — Ny must be a multiple of 2·Nx for an untwisted-torus embedding.
  // 3D — Nx, Ny, Nz are independent integers ≥ 2.
  Nx: 4, Ny: 8, Nz: 3,
  periodic_x: false,
  periodic_y: false,
  periodic_z: false,
  // Visual / global
  nodeDiam: 0.6,
  edgeLen: 1.0,
  speed: 2.0,
  heatRange: 5.0,
  autoScale: false,
  showLabels: true,
};

const STUB_FRACTION   = 0.5;   // length of a flat-periodic wrap stub, as a fraction of edgeLen
const EDGE_LABEL_LIFT = 0.08;

// Snapshot register values per node so we can restore after rebuilding the engine.
function snapshotRegisters(state) {
  return state.nodes.map(n => [...n.registers]);
}
function hydrateEngine(engine, snap) {
  if (!Array.isArray(snap)) return;
  const nLim = Math.min(snap.length, engine.nodes.length);
  for (let i = 0; i < nLim; i++) {
    const src = snap[i] || [];
    const dst = engine.nodes[i].registers;
    const lim = Math.min(src.length, dst.length);
    for (let j = 0; j < lim; j++) dst[j] = src[j];
  }
}

// Snap Ny to the nearest multiple of 2·Nx (clamped to [2·Nx, 2·Nx·MAX_K]).
// This is the closure condition for an untwisted torus embedding of the
// hex lattice: Ny = 2·k·Nx for some integer k ≥ 1.
const MAX_K = 16;
function snapNy(nx, ny) {
  const step = 2 * nx;
  let k = Math.round(ny / step);
  if (k < 1) k = 1;
  if (k > MAX_K) k = MAX_K;
  return step * k;
}

function buildEngine(s) {
  if (s.dim === 2) {
    s.Ny = snapNy(s.Nx, s.Ny);
    return build2D(s.Nx, s.Ny, { periodic_x: s.periodic_x, periodic_y: s.periodic_y });
  }
  if (s.dim === 3) {
    return build3D(s.Nx, s.Ny, s.Nz, {
      periodic_x: s.periodic_x, periodic_y: s.periodic_y, periodic_z: s.periodic_z,
    });
  }
  return build1D(s.N, { periodic: s.periodic });
}

function loadState() {
  let raw = {};
  try {
    const txt = localStorage.getItem(STATE_KEY);
    if (txt) raw = JSON.parse(txt);
  } catch {}
  const s = { ...DEFAULT };
  for (const k of Object.keys(DEFAULT)) if (raw[k] !== undefined) s[k] = raw[k];
  s.engine = buildEngine(s);
  hydrateEngine(s.engine, raw.registers);
  return s;
}

function saveState() {
  const { engine, ...rest } = S;
  const out = { ...rest, registers: snapshotRegisters(engine) };
  localStorage.setItem(STATE_KEY, JSON.stringify(out));
}

function loadProfiles() {
  try { return JSON.parse(localStorage.getItem(PROF_KEY) || '{}'); }
  catch { return {}; }
}
function saveProfiles(p) { localStorage.setItem(PROF_KEY, JSON.stringify(p)); }

let S = loadState();
let clockState = 0;
let running = false;
let runTimer = null;

/* ── Scene ─────────────────────────────────────────────── */

const view = $('view');
const { scene, camera, renderer, controls } = createScene(view, {
  camPos: [0, 2.5, 6],
});
autoResize(renderer, camera, view);
controls.target.set(0, 0, 0);

const graphGroup = new THREE.Group();
scene.add(graphGroup);

// per-edge: { halves: [{ mesh, mat, label, mid, isStub }, { … }], stub: bool }
const nodes = []; // { group, ringMat, frame }
const edges = [];

const RING_TUBE = 0.035;
const EDGE_TUBE = 0.05;

/* ── Color helpers ─────────────────────────────────────── */

const COLD = [0.10, 0.55, 1.00];
const NEUT = [0.40, 0.40, 0.45];
const HOT  = [1.00, 0.35, 0.10];

function heatColor(val, range) {
  const t = Math.max(-1, Math.min(1, val / range));
  const tgt = t >= 0 ? HOT : COLD;
  const a = Math.abs(t);
  return new THREE.Color(
    NEUT[0] + (tgt[0] - NEUT[0]) * a,
    NEUT[1] + (tgt[1] - NEUT[1]) * a,
    NEUT[2] + (tgt[2] - NEUT[2]) * a,
  );
}

const NODE_RING_BASE = new THREE.Color(0.30, 0.30, 0.36);

/* ── Geometry layout ───────────────────────────────────── */

// edgeLen is the visible tube length (rim outer equator to rim outer
// equator). Center-to-center distance is edgeLen + nodeDiam + 2·RING_TUBE.
// Edges attach to the outer equator of each node ring, not the centerline.

// Layout produces a per-node frame: { pos, localX, localY, localZ, r }
// localX/Y/Z are an orthonormal basis; the node ring lies in the plane
// spanned by localX/localY with normal along localZ.
//
// Three layout modes:
//   - 1D flat  — chain along world X
//   - 1D ring  — ferris wheel in world XY (axle = world Z)
//   - 2D flat  — hex sheet in world XZ (normals = world +Y)
//
// All flat layouts share the same orientation; only positions differ.

function flatBasis() {
  return {
    localX: new THREE.Vector3(1, 0, 0),
    localY: new THREE.Vector3(0, 0, -1),
    localZ: new THREE.Vector3(0, 1, 0),
  };
}

// Cell pitch: distance between adjacent node centers, including the rim
// half-thickness on each side so the visible tube length matches edgeLen.
function cellPitch() { return S.nodeDiam + S.edgeLen + 2 * RING_TUBE; }

// Each frame carries:
//   pos        — world position
//   localX/Y/Z — orthonormal basis (only used when type === 'ring')
//   r          — visible node radius (sphere or torus major radius)
//   attachR    — distance from center to where edges connect (= outer rim)
//   type       — 'ring' (1D / 2D) or 'sphere' (3D)
function ringFrame(extra) {
  const r = S.nodeDiam / 2;
  return { ...flatBasis(), r, attachR: r + RING_TUBE, type: 'ring', ...extra };
}

function nodeFrame1D(i) {
  const x = (i - (S.N - 1) / 2) * cellPitch();
  return ringFrame({ pos: new THREE.Vector3(x, 0, 0) });
}

function nodeFrameRing(i) {
  const r = S.nodeDiam / 2;
  const R = cellPitch() / (2 * Math.sin(Math.PI / S.N));
  const theta = i * TAU / S.N;
  const c = Math.cos(theta), s = Math.sin(theta);
  return {
    pos:    new THREE.Vector3(R * c, R * s, 0),
    localX: new THREE.Vector3(-s, c, 0),
    localY: new THREE.Vector3(0, 0, 1),
    localZ: new THREE.Vector3(c, s, 0),
    r,
    attachR: r + RING_TUBE,
    type: 'ring',
  };
}

// 2D flat: read engine.positions (lattice coords, every edge unit-length),
// centroid-shift, scale by cellPitch so the visible tube between adjacent
// node rims matches edgeLen. Lattice (x, y) → world (x, 0, y); the sheet
// lies in xz with normal up.
function nodeFrame2DFlat(i, centroid) {
  const p = S.engine.positions[i];
  const pitch = cellPitch();
  return ringFrame({
    pos: new THREE.Vector3(
      (p[0] - centroid[0]) * pitch, 0,
      (p[1] - centroid[1]) * pitch,
    ),
  });
}

// 3D flat: lattice (x, y, z) → world (x, y, z) directly. Nodes render as
// spheres (4 incident edges go in tetrahedral directions; a flat ring's
// plane cannot align with all of them).
function nodeFrame3DFlat(i, centroid) {
  const r = S.nodeDiam / 2;
  const p = S.engine.positions[i];
  const pitch = cellPitch();
  return {
    pos: new THREE.Vector3(
      (p[0] - centroid[0]) * pitch,
      (p[1] - centroid[1]) * pitch,
      (p[2] - centroid[2]) * pitch,
    ),
    r,
    attachR: r,
    type: 'sphere',
  };
}

function computeCentroid(state) {
  const dim = state.positions[0].length;
  const c = new Array(dim).fill(0);
  for (const p of state.positions) for (let k = 0; k < dim; k++) c[k] += p[k];
  for (let k = 0; k < dim; k++) c[k] /= state.positions.length;
  return c;
}

// 2D torus embedding (wrap mode with both axes periodic).
//
// With Ny = 2·k·Nx (the closure constraint), the lattice tiles a 3D torus
// without twist. The embedding identifies:
//   φ = 2π · (i + j/2) / Nx     (preserves hex skew along â₁)
//   θ = 2π · j / Ny             (full minor revolution after Ny rows)
//
// World position (axle along Y, major loop in XZ plane):
//   x = (R + r·cosθ) · cosφ
//   y = r·sinθ
//   z = (R + r·cosθ) · sinφ
//
// Major and minor radii are picked for visual aesthetic (R > r); the
// lattice cells are slightly compressed in θ for k = 1 to keep the
// torus non-self-intersecting.
function torusRadii() {
  const pitch = cellPitch();
  const R = Math.max(1.0, S.Nx * pitch * 0.5);
  const r = R * 0.45;
  return { R, r };
}

function decompose2D(idx) {
  const sublat = idx & 1;
  const cell   = idx >> 1;
  const i      = cell % S.Nx;
  const j      = (cell - i) / S.Nx;
  return { i, j, sublat };
}

function nodeFrame2DTorus(idx) {
  const { R, r } = torusRadii();
  const r_disk = S.nodeDiam / 2;
  const { i, j, sublat } = decompose2D(idx);
  // Sublattice B sits at d_AB within the cell (= a₁/3 + a₂/3).
  let ie = i, je = j;
  if (sublat === 1) { ie += 1/3; je += 1/3; }

  const phi   = 2 * Math.PI * (ie + je / 2) / S.Nx;
  const theta = 2 * Math.PI * je / S.Ny;
  const cP = Math.cos(phi),   sP = Math.sin(phi);
  const cT = Math.cos(theta), sT = Math.sin(theta);

  const pos = new THREE.Vector3(
    (R + r * cT) * cP,
    r * sT,
    (R + r * cT) * sP,
  );
  // localZ = surface normal (radially outward from tube center)
  const localZ = new THREE.Vector3(cT * cP, sT, cT * sP);
  // localX = tangent along major (φ) direction
  const localX = new THREE.Vector3(-sP, 0, cP);
  // localY = localZ × localX (tangent along minor (θ) direction)
  const localY = new THREE.Vector3().crossVectors(localZ, localX).normalize();
  return { pos, localX, localY, localZ, r: r_disk };
}

function isTorusLayout() {
  return S.dim === 2 && S.wrap && S.periodic_x && S.periodic_y;
}

function makeFrames() {
  const N = S.engine.nodes.length;
  const frames = new Array(N);
  if (S.dim === 1 && S.wrap) {
    for (let i = 0; i < N; i++) frames[i] = nodeFrameRing(i);
  } else if (S.dim === 1) {
    for (let i = 0; i < N; i++) frames[i] = nodeFrame1D(i);
  } else if (isTorusLayout()) {
    for (let i = 0; i < N; i++) frames[i] = nodeFrame2DTorus(i);
  } else if (S.dim === 3) {
    const centroid = computeCentroid(S.engine);
    for (let i = 0; i < N; i++) frames[i] = nodeFrame3DFlat(i, centroid);
  } else {
    const centroid = computeCentroid(S.engine);
    for (let i = 0; i < N; i++) frames[i] = nodeFrame2DFlat(i, centroid);
  }
  return frames;
}

// World-space direction "from tail toward head" for a given edge.
// In ring/torus layouts we use the chord direction (since the lattice
// is bridged by the visual closure); in flat layouts we use the engine's
// per-edge displacement, which gives the right direction for both wrap
// and non-wrap edges.
function edgeWorldDir(state, ei, frames) {
  const e = state.edges[ei];
  if ((S.dim === 1 && S.wrap) || isTorusLayout()) {
    return frames[e.head].pos.clone().sub(frames[e.tail].pos).normalize();
  }
  const d = e.displacement;
  // 1D / 2D displacement is 2-component (lattice y → world z); 3D is
  // 3-component (lattice xyz → world xyz directly).
  if (d.length >= 3) return new THREE.Vector3(d[0], d[1], d[2]).normalize();
  return new THREE.Vector3(d[0], 0, d[1]).normalize();
}

// Whether to render an edge as two faded boundary stubs. Ring/torus
// layouts bridge their lattice wraps, so no stubs there; flat layouts
// stub every wrap edge.
function shouldStub(state, ei) {
  if (S.dim === 1 && S.wrap) return false;
  if (isTorusLayout()) return false;
  return isWrapEdge(state, ei);
}

// For ring nodes (1D / 2D), project the world edge direction onto the
// ring's plane (perpendicular to localZ) so that the rim attach lands
// on the outer equator. For sphere nodes (3D), the sphere is rotationally
// symmetric, so the unprojected direction works directly.
const _tmpProj = new THREE.Vector3();
function attachDirForFrame(frame, dir) {
  if (frame.type !== 'ring') return dir;
  const along = dir.dot(frame.localZ);
  _tmpProj.copy(dir).addScaledVector(frame.localZ, -along);
  const len = _tmpProj.length();
  if (len < 1e-9) return dir;   // edge runs along the ring's normal — fall back
  return _tmpProj.clone().divideScalar(len);
}

/* ── Build / rebuild ───────────────────────────────────── */

function clearGraph() {
  graphGroup.clear();
  for (const n of nodes) n.ringMat.dispose();
  for (const e of edges) {
    if (!e) continue;
    for (const h of e.halves) {
      h.mat.dispose();
      h.mesh.geometry.dispose();
      h.label?.remove();
    }
  }
  nodes.length = 0;
  edges.length = 0;
}

function makeLabel(cls = '') {
  const el = document.createElement('div');
  el.className = 'label ' + cls;
  $('labels').appendChild(el);
  return el;
}

// Build a half-edge cylinder mesh from p0 (attached end) toward p1 (free end).
// userData is set by caller via `tag`. `opacity < 1` fades stubs.
function buildHalfMesh(p0, p1, tag, opacity = 1.0) {
  const dir = p1.clone().sub(p0);
  const len = dir.length();
  const mid = p0.clone().addScaledVector(dir, 0.5);
  const geo = new THREE.CylinderGeometry(EDGE_TUBE, EDGE_TUBE, len, 12);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x808080, roughness: 0.55, metalness: 0.1,
    transparent: opacity < 1.0, opacity,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(mid);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0), dir.clone().normalize(),
  );
  mesh.userData = tag;
  return { mesh, mat, mid, len };
}

function buildGraph() {
  clearGraph();

  const frames = makeFrames();

  // Nodes — torus rings in 1D / 2D, spheres in 3D.
  for (let i = 0; i < frames.length; i++) {
    const f = frames[i];
    const ringMat = new THREE.MeshStandardMaterial({
      color: NODE_RING_BASE, roughness: 0.6, metalness: 0.1,
    });
    let mesh, container;
    if (f.type === 'sphere') {
      const sphereGeo = new THREE.SphereGeometry(f.r, 16, 12);
      mesh = new THREE.Mesh(sphereGeo, ringMat);
      mesh.position.copy(f.pos);
      mesh.userData = { kind: 'node', index: i };
      container = mesh;
    } else {
      const ringGeo = new THREE.TorusGeometry(f.r, RING_TUBE, 8, 48);
      mesh = new THREE.Mesh(ringGeo, ringMat);
      mesh.userData = { kind: 'node', index: i };
      const group = new THREE.Group();
      group.position.copy(f.pos);
      group.quaternion.setFromRotationMatrix(
        new THREE.Matrix4().makeBasis(f.localX, f.localY, f.localZ),
      );
      group.add(mesh);
      container = group;
    }
    graphGroup.add(container);
    nodes.push({ group: container, ringMat, ring: mesh, frame: f });
  }

  // Edges — each edge → two half-meshes (tail half + head half), or
  // (when the edge wraps a periodic boundary in a flat layout) two
  // faded stub half-meshes extending outward from the two boundary nodes.
  for (let ei = 0; ei < S.engine.edges.length; ei++) {
    const eng = S.engine.edges[ei];
    const a = frames[eng.tail], b = frames[eng.head];
    const dir = edgeWorldDir(S.engine, ei, frames);
    // For ring nodes (1D / 2D), project the edge direction onto the
    // ring's tangent plane (perpendicular to localZ) before scaling by
    // attachR — otherwise, on curved layouts (1D ring, 2D torus) the
    // chord direction has a component along localZ and the attach point
    // ends up inward of the outer equator. Spheres (3D) are symmetric,
    // no projection needed.
    const tailDir = attachDirForFrame(a, dir);
    const headDir = attachDirForFrame(b, dir);
    const tailAttach = a.pos.clone().addScaledVector(tailDir, +a.attachR);
    const headAttach = b.pos.clone().addScaledVector(headDir, -b.attachR);
    const isStub = shouldStub(S.engine, ei);

    const halves = [];
    if (!isStub) {
      const mid = tailAttach.clone().addScaledVector(
        headAttach.clone().sub(tailAttach), 0.5,
      );
      const tailHalf = buildHalfMesh(tailAttach, mid,
        { kind: 'reg', edgeIdx: ei, end: 'tail' });
      const headHalf = buildHalfMesh(mid, headAttach,
        { kind: 'reg', edgeIdx: ei, end: 'head' });
      graphGroup.add(tailHalf.mesh, headHalf.mesh);
      halves.push(
        { ...tailHalf, label: makeLabel(), end: 'tail' },
        { ...headHalf, label: makeLabel(), end: 'head' },
      );
    } else {
      // Stub length = half the visible tube length, so two stubs add up to
      // one complete edge tube (visually telling the eye "this would be
      // the wrap edge, halved at each boundary").
      const stubLen = Math.max(0.05, S.edgeLen * STUB_FRACTION);
      // tail stub: extends in +dir (outward at tail boundary)
      const tailFar = tailAttach.clone().addScaledVector(dir, stubLen);
      const tailHalf = buildHalfMesh(tailAttach, tailFar,
        { kind: 'reg', edgeIdx: ei, end: 'tail' }, 0.7);
      // head stub: extends in −dir (outward at head boundary)
      const headFar = headAttach.clone().addScaledVector(dir, -stubLen);
      const headHalf = buildHalfMesh(headAttach, headFar,
        { kind: 'reg', edgeIdx: ei, end: 'head' }, 0.7);
      graphGroup.add(tailHalf.mesh, headHalf.mesh);
      halves.push(
        { ...tailHalf, label: makeLabel('l-stub'), end: 'tail', stub: true },
        { ...headHalf, label: makeLabel('l-stub'), end: 'head', stub: true },
      );
    }
    edges.push({ halves, isStub });
  }

  applyValues();
}

/* ── Apply values to visuals ───────────────────────────── */

function applyValues() {
  // Compute heat range, optionally auto-fitting to current max |register|.
  let range = S.heatRange;
  if (S.autoScale) {
    let mx = 0;
    for (const n of S.engine.nodes) for (const r of n.registers) mx = Math.max(mx, Math.abs(r));
    if (mx > 0) {
      const target = Math.max(0.5, mx * 1.05);
      range = S.heatRange + (target - S.heatRange) * 0.35;
      S.heatRange = range;
      $('sl-heat').value = Math.min(50, Math.max(0.5, range)).toFixed(1);
      $('v-heat').textContent = range.toFixed(1);
    }
  }

  // Edges → per-half heat color, label = register value.
  for (let ei = 0; ei < edges.length; ei++) {
    const visual = edges[ei];
    const [tailVal, headVal] = getEdgeRegisters(S.engine, ei);
    const vals = { tail: tailVal, head: headVal };
    for (const h of visual.halves) {
      const v = vals[h.end];
      h.mat.color = heatColor(v, range);
      h.label.textContent = fmtVal(v);
    }
  }

  // Nodes — uniform base color (register state already on attached edge halves).
  for (const n of nodes) n.ringMat.color = NODE_RING_BASE;
}

/* ── Label positions (per-frame, screen-space) ─────────── */

const _projV = new THREE.Vector3();
function projectToScreen(world, w, h) {
  _projV.copy(world).project(camera);
  const off = _projV.z < -1 || _projV.z > 1;
  return {
    off,
    left: ( _projV.x + 1) * 0.5 * w,
    top:  (-_projV.y + 1) * 0.5 * h,
  };
}

function updateLabelPositions() {
  if (!S.showLabels) return;
  const w = view.clientWidth, h = view.clientHeight;
  for (const e of edges) {
    if (!e) continue;
    for (const half of e.halves) {
      const lift = half.mid.clone(); lift.y += EDGE_LABEL_LIFT;
      const p = projectToScreen(lift, w, h);
      half.label.style.display = p.off ? 'none' : '';
      if (!p.off) {
        half.label.style.left = p.left + 'px';
        half.label.style.top  = p.top  + 'px';
      }
    }
  }
}

function applyLabelVisibility() {
  $('labels').style.display = S.showLabels ? '' : 'none';
}

/* ── Clock half-step ───────────────────────────────────── */

function halfStep() {
  clockState = engineHalfStep(S.engine, null, clockState);
  $('clock-display').textContent = clockState;
  applyValues();
  updateInfo();
  saveState();
}

/* ── Run loop ──────────────────────────────────────────── */

function setRunning(r) {
  running = r;
  $('btn-run').textContent = r ? '⏸ Stop' : '▶ Run';
  $('btn-run').classList.toggle('on', r);
  if (runTimer) { clearInterval(runTimer); runTimer = null; }
  if (r) runTimer = setInterval(halfStep, 1000 / Math.max(0.1, S.speed));
}

/* ── Click → popup ─────────────────────────────────────── */

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let pendingTarget = null;  // { kind: 'reg', edgeIdx, end }

function pickAt(clientX, clientY) {
  const rect = view.getBoundingClientRect();
  mouse.x =  ((clientX - rect.left) / rect.width)  * 2 - 1;
  mouse.y = -((clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(graphGroup.children, true);
  for (const h of hits) {
    const ud = h.object.userData;
    if (ud && ud.kind === 'reg') return ud;
  }
  return null;
}

let startX = 0, startY = 0, downTime = 0;
view.addEventListener('pointerdown', e => {
  if (e.target.closest('#popup')) return;
  startX = e.clientX; startY = e.clientY; downTime = performance.now();
});
view.addEventListener('pointerup', e => {
  if (e.target.closest('#popup')) return;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  if (Math.hypot(dx, dy) > 4 || performance.now() - downTime > 400) return;
  const hit = pickAt(e.clientX, e.clientY);
  if (!hit) { hidePopup(); return; }
  pendingTarget = hit;
  const [tailVal, headVal] = getEdgeRegisters(S.engine, hit.edgeIdx);
  const cur = hit.end === 'tail' ? tailVal : headVal;
  showPopup(e.clientX, e.clientY,
    `Edge ${hit.edgeIdx} · ${hit.end} register`, fmtVal(cur));
});

function fmtVal(v) {
  if (Math.abs(v) < 1e-9) return '0';
  if (Math.abs(v) < 1e-3 || Math.abs(v) >= 1e5) return v.toExponential(3);
  return Number(v.toFixed(4)).toString();
}

function showPopup(x, y, label, val) {
  const popup = $('popup');
  $('pop-label').textContent = label;
  $('pop-input').value = val;
  const rect = view.getBoundingClientRect();
  popup.style.left = (x - rect.left + 12) + 'px';
  popup.style.top  = (y - rect.top  + 12) + 'px';
  popup.style.display = 'block';
  requestAnimationFrame(() => {
    const pr = popup.getBoundingClientRect();
    const vr = view.getBoundingClientRect();
    if (pr.right > vr.right) popup.style.left = (vr.right - pr.width - 6 - vr.left) + 'px';
    if (pr.bottom > vr.bottom) popup.style.top = (vr.bottom - pr.height - 6 - vr.top) + 'px';
  });
  $('pop-input').focus();
  $('pop-input').select();
}

function hidePopup() {
  $('popup').style.display = 'none';
  pendingTarget = null;
}

function commitPopup() {
  if (!pendingTarget) { hidePopup(); return; }
  const raw = $('pop-input').value.trim();
  const v = Number(raw);
  if (!Number.isFinite(v)) { hidePopup(); return; }
  setEdgeRegister(S.engine, pendingTarget.edgeIdx, pendingTarget.end, v);
  hidePopup();
  applyValues();
  saveState();
}

$('pop-ok').onclick     = commitPopup;
$('pop-cancel').onclick = hidePopup;
$('pop-input').addEventListener('keydown', e => {
  if (e.key === 'Enter')  { e.preventDefault(); commitPopup(); }
  if (e.key === 'Escape') { e.preventDefault(); hidePopup(); }
});

/* ── Camera fit ────────────────────────────────────────── */

function fitCamera() {
  // Find the layout's extent by sampling node positions in the current frames.
  const frames = makeFrames();
  let minX =  Infinity, maxX = -Infinity;
  let minZ =  Infinity, maxZ = -Infinity;
  let minY =  Infinity, maxY = -Infinity;
  for (const f of frames) {
    minX = Math.min(minX, f.pos.x); maxX = Math.max(maxX, f.pos.x);
    minY = Math.min(minY, f.pos.y); maxY = Math.max(maxY, f.pos.y);
    minZ = Math.min(minZ, f.pos.z); maxZ = Math.max(maxZ, f.pos.z);
  }
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, cz = (minZ + maxZ) / 2;
  const extent = Math.max(maxX - minX, maxY - minY, maxZ - minZ) + cellPitch();
  const d = Math.max(2.5, extent * 0.85);
  camera.position.set(cx, cy + d * 0.55, cz + d * 1.1);
  controls.target.set(cx, cy, cz);
  controls.update();
}

/* ── Info line ─────────────────────────────────────────── */

function updateInfo() {
  let topo;
  if (S.dim === 1) {
    topo = `1D · ${S.periodic ? 'periodic' : 'open'}${S.wrap ? ' · ring' : ''} · N=${S.N}`;
  } else if (S.dim === 2) {
    const px = S.periodic_x ? 'X' : '';
    const py = S.periodic_y ? 'Y' : '';
    const pflag = (px || py) ? `periodic ${px}${py}` : 'open';
    const k = S.Ny / (2 * S.Nx);
    const toroidal = isTorusLayout() ? ` · torus (k=${k})` : '';
    topo = `2D hex · ${pflag} · ${S.Nx}×${S.Ny}${toroidal}`;
  } else {
    const px = S.periodic_x ? 'X' : '';
    const py = S.periodic_y ? 'Y' : '';
    const pz = S.periodic_z ? 'Z' : '';
    const pflag = (px || py || pz) ? `periodic ${px}${py}${pz}` : 'open';
    topo = `3D diamond · ${pflag} · ${S.Nx}×${S.Ny}×${S.Nz}`;
  }
  $('info').textContent =
    `${topo} · nodes=${S.engine.nodes.length} · edges=${S.engine.edges.length}` +
    ` · model: scattering` +
    ` · range: ±${S.heatRange.toFixed(1)}${S.autoScale ? ' (auto)' : ''}` +
    ` · energy: ${totalEnergy(S.engine).toFixed(3)}`;
}

/* ── Profiles ──────────────────────────────────────────── */

function refreshProfileList() {
  const sel = $('sel-prof');
  const profs = loadProfiles();
  const names = Object.keys(profs).sort();
  sel.innerHTML = '<option value="">—</option>' +
    names.map(n => `<option value="${n}">${n}</option>`).join('');
}

$('btn-save').onclick = () => {
  const name = (prompt('Profile name?') || '').trim();
  if (!name) return;
  const profs = loadProfiles();
  const { engine, ...rest } = S;
  profs[name] = { ...rest, registers: snapshotRegisters(engine) };
  saveProfiles(profs);
  refreshProfileList();
  $('sel-prof').value = name;
};

$('btn-del').onclick = () => {
  const name = $('sel-prof').value;
  if (!name) return;
  if (!confirm(`Delete profile "${name}"?`)) return;
  const profs = loadProfiles();
  delete profs[name];
  saveProfiles(profs);
  refreshProfileList();
};

$('sel-prof').onchange = () => {
  const name = $('sel-prof').value;
  if (!name) return;
  const profs = loadProfiles();
  if (!profs[name]) return;
  const loaded = profs[name];
  S = { ...DEFAULT };
  for (const k of Object.keys(DEFAULT)) if (loaded[k] !== undefined) S[k] = loaded[k];
  S.engine = buildEngine(S);
  hydrateEngine(S.engine, loaded.registers);
  syncControls();
  applyDimVisibility();
  buildGraph();
  fitCamera();
  updateInfo();
  saveState();
};

/* ── Control bindings ──────────────────────────────────── */

function syncControls() {
  $('sel-dim').value   = String(S.dim);
  $('in-N').value      = S.N;
  $('cb-periodic').checked = S.periodic;
  $('cb-wrap').checked = S.wrap;
  $('in-Nx').value     = S.Nx;
  $('in-Ny').value     = S.Ny;
  // In 2D, Ny step/min track Nx so up/down arrows produce closeable values.
  // In 3D, Ny is unconstrained.
  if (S.dim === 2) {
    $('in-Ny').step    = String(2 * S.Nx);
    $('in-Ny').min     = String(2 * S.Nx);
  } else {
    $('in-Ny').step    = '1';
    $('in-Ny').min     = '2';
  }
  $('in-Nz').value     = S.Nz;
  $('cb-px').checked   = S.periodic_x;
  $('cb-py').checked   = S.periodic_y;
  $('cb-pz').checked   = S.periodic_z;
  $('sel-preset').value = '';
  $('sl-diam').value   = S.nodeDiam;  $('v-diam').textContent = S.nodeDiam.toFixed(2);
  $('sl-edge').value   = S.edgeLen;   $('v-edge').textContent = S.edgeLen.toFixed(2);
  $('sl-speed').value  = S.speed;     $('v-speed').textContent= S.speed.toFixed(1);
  $('sl-heat').value   = S.heatRange; $('v-heat').textContent = S.heatRange.toFixed(1);
  $('cb-auto').checked = S.autoScale;
  $('cb-labels').checked = S.showLabels;
  $('clock-display').textContent = clockState;
}

function applyDimVisibility() {
  const d = S.dim;
  for (const el of document.querySelectorAll('.dim-1d')) {
    el.style.display = (d === 1) ? '' : 'none';
  }
  for (const el of document.querySelectorAll('.dim-23')) {
    el.style.display = (d === 2 || d === 3) ? '' : 'none';
  }
  for (const el of document.querySelectorAll('.dim-3d')) {
    el.style.display = (d === 3) ? '' : 'none';
  }
  refreshPresetList();
}

function refreshPresetList() {
  const sel = $('sel-preset');
  const names = engineListPresets(S.dim);
  sel.innerHTML = '<option value="">—</option>' +
    names.map(n => `<option value="${n}">${PRESET_LABEL[n] || n}</option>`).join('');
}

function rebuildGraphFromState() {
  const snap = snapshotRegisters(S.engine);
  S.engine = buildEngine(S);
  hydrateEngine(S.engine, snap);
  buildGraph();
  updateInfo();
  saveState();
}

$('sel-dim').onchange = e => {
  S.dim = parseInt(e.target.value, 10);
  applyDimVisibility();
  // Switching dim discards register state (shapes don't match) and resets clock.
  S.engine = buildEngine(S);
  clockState = 0;
  $('clock-display').textContent = 0;
  buildGraph();
  fitCamera();
  updateInfo();
  saveState();
};
$('in-N').oninput = e => {
  let n = parseInt(e.target.value, 10);
  if (!Number.isFinite(n)) return;
  n = Math.max(2, Math.min(64, n));
  if (n !== S.N) { S.N = n; rebuildGraphFromState(); }
};
$('cb-periodic').onchange = e => {
  S.periodic = e.target.checked;
  rebuildGraphFromState();
};
$('cb-wrap').onchange = e => {
  S.wrap = e.target.checked;
  buildGraph();
  fitCamera();
  updateInfo();
  saveState();
};
$('in-Nx').oninput = e => {
  let n = parseInt(e.target.value, 10);
  if (!Number.isFinite(n)) return;
  n = Math.max(2, Math.min(32, n));
  if (n === S.Nx) return;
  S.Nx = n;
  if (S.dim === 2) {
    // 2D: re-snap Ny to the new Nx's closeable multiples.
    S.Ny = snapNy(S.Nx, S.Ny);
    $('in-Ny').value = S.Ny;
  }
  rebuildGraphFromState();
  fitCamera();
};
$('in-Ny').oninput = e => {
  let n = parseInt(e.target.value, 10);
  if (!Number.isFinite(n)) return;
  if (S.dim === 2) {
    // Snap to nearest closeable Ny.
    const snapped = snapNy(S.Nx, n);
    if (snapped === S.Ny) return;
    S.Ny = snapped;
    $('in-Ny').value = S.Ny;
  } else {
    n = Math.max(2, Math.min(256, n));
    if (n === S.Ny) return;
    S.Ny = n;
  }
  rebuildGraphFromState();
  fitCamera();
};
$('in-Nz').oninput = e => {
  let n = parseInt(e.target.value, 10);
  if (!Number.isFinite(n)) return;
  n = Math.max(2, Math.min(10, n));
  if (n === S.Nz) return;
  S.Nz = n;
  rebuildGraphFromState();
  fitCamera();
};
$('cb-px').onchange = e => { S.periodic_x = e.target.checked; rebuildGraphFromState(); };
$('cb-py').onchange = e => { S.periodic_y = e.target.checked; rebuildGraphFromState(); };
$('cb-pz').onchange = e => { S.periodic_z = e.target.checked; rebuildGraphFromState(); };
$('sel-preset').onchange = e => {
  const name = e.target.value;
  if (!name) return;
  engineApplyPreset(S.engine, name);
  clockState = 0;
  $('clock-display').textContent = clockState;
  applyValues();
  updateInfo();
  saveState();
  e.target.value = '';
};
$('sl-diam').oninput = e => {
  S.nodeDiam = parseFloat(e.target.value);
  $('v-diam').textContent = S.nodeDiam.toFixed(2);
  rebuildGraphFromState();
};
$('sl-edge').oninput = e => {
  S.edgeLen = parseFloat(e.target.value);
  $('v-edge').textContent = S.edgeLen.toFixed(2);
  rebuildGraphFromState();
};
$('sl-speed').oninput = e => {
  S.speed = parseFloat(e.target.value);
  $('v-speed').textContent = S.speed.toFixed(1);
  if (running) setRunning(true);
  saveState();
};
$('sl-heat').oninput = e => {
  S.heatRange = parseFloat(e.target.value);
  $('v-heat').textContent = S.heatRange.toFixed(1);
  applyValues(); updateInfo(); saveState();
};
$('cb-auto').onchange = e => {
  S.autoScale = e.target.checked; applyValues(); updateInfo(); saveState();
};
$('cb-labels').onchange = e => {
  S.showLabels = e.target.checked; applyLabelVisibility(); saveState();
};
$('btn-step').onclick  = () => { halfStep(); };
$('btn-run').onclick   = () => setRunning(!running);
$('btn-clear').onclick = () => {
  engineClear(S.engine);
  clockState = 0;
  $('clock-display').textContent = 0;
  applyValues();
  updateInfo();
  saveState();
};
$('btn-fit').onclick = fitCamera;

/* ── Bootstrap ─────────────────────────────────────────── */

syncControls();
applyDimVisibility();
buildGraph();
applyLabelVisibility();
fitCamera();
updateInfo();
refreshProfileList();

animLoop(() => {
  if (S.autoScale && !running) applyValues();
  updateLabelPositions();
}, { renderer, scene, camera, controls });
</script>
</body>
</html>
